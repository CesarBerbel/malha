server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;

    # Sempre revalidar: os arquivos não têm hash no nome, então assim atualizações chegam na hora
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # O manifesto do PWA precisa do tipo correto para o app ser instalável
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
